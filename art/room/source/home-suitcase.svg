<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 182" width="104" height="182" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Home suitcase: the travel hard-shell spinner recoloured lilac so it reads against the blue wardrobe and the pink rug. It is the Source control on Home. Ids are prefixed hsc-.
       Tones (lilac): fill #D8C6F0, shade #C3ABE6, outline #A98CD6, highlight #EEE4FA; handles and wheels #B79BE0 / #8466B8.
       Shell x 2..102, y 16..166; the side band is x 94..102. Front face centre x 48.
       Label zone (flat, plain): x 4..92, y 30..78. An 88 x 48 luggage-tag plate sits at x 4, y 30.
       The tag strap loops round the grip and comes straight down into the plate's top centre (48, 30);
       the plate draws the last bit of strap down to its eyelet, so the strap reads as threaded through it. Wheels rest on y 178.6; contact shadow to y 182. -->
  <defs><clipPath id="hsc-shell"><path d="M15 16H89Q102 16 102 29V153Q102 166 89 166H15Q2 166 2 153V29Q2 16 15 16Z"/></clipPath></defs>
  <ellipse cx="52" cy="178.8" rx="51" ry="2.6" fill="#7A4636" opacity=".13"/>
  <!-- rear wheels -->
  <g transform="translate(21 162.8) scale(0.82)"><path d="M-6.5 0H6.5L5.2 4.6H-5.2Z" fill="#B79BE0" stroke="#8466B8" stroke-width="1.3"/><rect x="-4.2" y="3.4" width="8.4" height="9.2" rx="3.6" fill="#B79BE0" stroke="#8466B8" stroke-width="1.3"/><path d="M1.6 5.6V10.4" stroke="#8466B8" stroke-width="1" opacity=".8"/><circle cx="-.6" cy="8" r="1.3" fill="#EEE4FA"/></g><g transform="translate(96.5 162.8) scale(0.82)"><path d="M-6.5 0H6.5L5.2 4.6H-5.2Z" fill="#B79BE0" stroke="#8466B8" stroke-width="1.3"/><rect x="-4.2" y="3.4" width="8.4" height="9.2" rx="3.6" fill="#B79BE0" stroke="#8466B8" stroke-width="1.3"/><path d="M1.6 5.6V10.4" stroke="#8466B8" stroke-width="1" opacity=".8"/><circle cx="-.6" cy="8" r="1.3" fill="#EEE4FA"/></g>
  <!-- trolley handle, retracted: two posts and a rounded grip -->
