<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 182" width="104" height="182" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Tall structured tote, seen from the front and a little above so the inside back wall shows. Ids are prefixed stt-.
       Tones (blue): fill #A9CBEF, shade #8FB8E6, outline #6C9AD0, highlight #C9E0F6; handles #7EA6DA / #557FB6.
       Front panel is a soft trapezoid, x 2..102 at the rim (y 29) narrowing to x 9..95 at the base; the side band runs x 94..88.
       Plain face for the live-text plates: x 4..92, y 30..76 and x 2..102, y 81..121.
       The tag strap loops round the front handle and comes straight down into (48, 30). Base rests on y 178.6; contact shadow to y 182. -->
  <defs><clipPath id="stt-body"><path d="M4.4 29H99.6Q102.2 29 102 31.6L95.4 174.6Q95.2 178 91.8 178H12.2Q8.8 178 8.6 174.6L2 31.6Q1.8 29 4.4 29Z"/></clipPath></defs>
  <ellipse cx="52" cy="178.8" rx="45" ry="2.6" fill="#7A4636" opacity=".13"/>
  <!-- back handle -->
  <path d="M38 19C38 .6 90 .6 90 19" stroke="#557FB6" stroke-width="6"/>
  <path d="M38 19C38 .6 90 .6 90 19" stroke="#7EA6DA" stroke-width="3.8"/>
  <!-- inside: back wall with a small pocket, side gussets folding in -->
  <path d="M8 16H96L98 30H6Z" fill="#7EA6DA"/>
  <rect x="56" y="18.6" width="22" height="14" rx="1.4" fill="#8FB8E6" stroke="#557FB6" stroke-width=".9" opacity=".9"/>
  <path d="M58 21.2H76" stroke="#557FB6" stroke-width=".8" stroke-dasharray="1.2 1.6" opacity=".55"/>
  <path d="M6 30L7 24.6H97L98 30Z" fill="#557FB6" opacity=".22"/>
  <path d="M8 16L2 30H12Z" fill="#8FB8E6"/>
  <path d="M96 16L102 30H92Z" fill="#8FB8E6"/>
  <path d="M8 16L12 30M96 16L92 30" stroke="#6C9AD0" stroke-width="1" opacity=".8"/>
  <path d="M2 30L8 16H96L102 30" stroke="#6C9AD0" stroke-width="1.5"/>
  <path d="M10.6 17.6H40" stroke="#C9E0F6" stroke-width="1.1" opacity=".8"/>
  <!-- front panel -->
  <path d="M4.4 29H99.6Q102.2 29 102 31.6L95.4 174.6Q95.2 178 91.8 178H12.2Q8.8 178 8.6 174.6L2 31.6Q1.8 29 4.4 29Z" fill="#A9CBEF"/>
  <g clip-path="url(#stt-body)">
    <path d="M94.2 27L87.8 180H104V27Z" fill="#8FB8E6"/>
    <path d="M94.2 41L88.4 178" stroke="#6C9AD0" stroke-width="1.2"/>
    <path d="M98 44L93 164" stroke="#6C9AD0" stroke-width="1.1" stroke-dasharray="1.4 2.2" opacity=".7"/>
    <path d="M0 167Q52 164 104 167V180H0Z" fill="#8FB8E6" opacity=".75"/>
    <!-- folded band at the rim -->
    <path d="M0 42.2H104" stroke="#8FB8E6" stroke-width="2.6"/>
    <path d="M0 41H104" stroke="#6C9AD0" stroke-width="1.2"/>
    <path d="M4 37.8H100" stroke="#6C9AD0" stroke-width=".8" stroke-dasharray="1.4 2" opacity=".5"/>
    <path d="M11.8 148L7.6 47" stroke="#C9E0F6" stroke-width="2.2"/>
    <path d="M6.6 32.6H42" stroke="#C9E0F6" stroke-width="1.6"/>
  </g>
  <path d="M4.4 29H99.6Q102.2 29 102 31.6L95.4 174.6Q95.2 178 91.8 178H12.2Q8.8 178 8.6 174.6L2 31.6Q1.8 29 4.4 29Z" stroke="#6C9AD0" stroke-width="1.5"/>
  <!-- front handle, riveted to the band -->
  <path d="M24 39V31C24 -6 80 -6 80 31V39" stroke="#557FB6" stroke-width="6"/>
  <path d="M24 39V31C24 -6 80 -6 80 31V39" stroke="#7EA6DA" stroke-width="3.8"/>
  <path d="M24.6 22C25.6 10 30.4 4.6 37 2.8" stroke="#C9E0F6" stroke-width="1" opacity=".8"/>
  <rect x="20.6" y="32" width="6.8" height="9.4" rx="2" fill="#7EA6DA" stroke="#557FB6" stroke-width="1.2"/>
  <rect x="76.6" y="32" width="6.8" height="9.4" rx="2" fill="#7EA6DA" stroke="#557FB6" stroke-width="1.2"/>
  <circle cx="24" cy="36.8" r="1.1" fill="#C9E0F6"/>
  <circle cx="80" cy="36.8" r="1.1" fill="#C9E0F6"/>
  <!-- luggage-tag strap: wrapped round the handle, down to the plate's eyelet -->
  <path d="M40 11.4C39.4 17.6 48 21 48 27V35" stroke="#B98632" stroke-width="3.8"/>
  <path d="M40 11.4C39.4 17.6 48 21 48 27V35" stroke="#E7BC6E" stroke-width="2"/>
  <rect x="37.4" y=".9" width="5.2" height="11.4" rx="1.6" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
  <path d="M39 3V10" stroke="#F6DB9E" stroke-width="1"/>
</svg>
