  <path d="M40.4 10l-6.4 -1M38.3 16.2l-6.4 -1M36.3 22.4l-6.4 -1M34.2 28.6l-6.4 -1M32.1 34.8l-6.4 -1M30.1 41l-6.4 -1M28 47.2l-6.4 -1M25.9 53.4l-6.4 -1M23.9 59.6l-6.4 -1M21.8 65.8l-6.4 -1M19.7 72l-6.4 -1M17.7 78.2l-6.4 -1M15.6 84.4l-6.4 -1M13.5 90.6l-6.4 -1M11.5 96.8l-6.4 -1" stroke="#D9C6A5" stroke-width="2.2"/>
