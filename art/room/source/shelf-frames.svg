<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 102" width="122" height="102" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Three cream picture cards standing on a wood shelf with two brackets. -->
  <!-- Cards: x 4 / 44 / 84, y 6, 34 x 66. Blank inside (mat line inset 2.4): x 6.4..35.6, y 8.4..69.6, plus 40 and 80 for the other two.
       Knob (a peg the outfit hangs from) centred at (21, 7.2), plus 40 and 80. The page overlays a small outfit in each. -->
  <!-- Board: x 1..121, y 71..82 (top face y 71..74, front edge y 74..82), the same 11-unit profile as shelf-top. Brackets y 82..100. -->

  <defs>
    <g id="sf-card">
      <rect width="34" height="66" rx="2.6" fill="#FFF7EA"/>
      <!-- soft shade along the bottom and right, like a card standing in light from the upper left -->
      <path d="M31.4 2.4V63.6H2.6V66H31.4A2.6 2.6 0 0 0 34 63.4V2.6A2.6 2.6 0 0 0 31.4 0Z" fill="#F3E6D0"/>
      <rect x="2.4" y="2.4" width="29.2" height="61.2" rx="1.4" stroke="#F3E6D0" stroke-width=".9"/>
      <rect width="34" height="66" rx="2.6" stroke="#D9C6A5" stroke-width="1.3"/>
      <!-- hanging knob on the top edge -->
      <circle cx="17" cy="1.2" r="3.3" fill="#E7BC6E"/>
      <path d="M13.7 1.2A3.3 3.3 0 0 0 20.3 1.2Z" fill="#D9A650"/>
      <circle cx="16" cy=".1" r=".95" fill="#F8E3B0"/>
      <circle cx="17" cy="1.2" r="3.3" stroke="#B98632" stroke-width="1.25"/>
    </g>
    <g id="sf-bracket">
      <path d="M0 0H11L9.3 15.4C9.1 17 8.1 18 6.6 18H4.4C2.9 18 1.9 17 1.7 15.4Z" fill="#E7BC6E"/>
      <path d="M6.4 0H11L9.3 15.4C9.1 17 8.1 18 6.6 18H5.8Z" fill="#D9A650"/>
      <path d="M0 0H11L10.7 3.2H.3Z" fill="#D9A650"/>
      <path d="M3.2 5.4L3.6 14.2" stroke="#F3D391" stroke-width="1.1"/>
      <path d="M0 0H11L9.3 15.4C9.1 17 8.1 18 6.6 18H4.4C2.9 18 1.9 17 1.7 15.4Z" stroke="#B98632" stroke-width="1.3"/>
      <circle cx="5.5" cy="9" r=".9" fill="#B98632"/>
    </g>
  </defs>

  <!-- brackets, under the board -->
  <use href="#sf-bracket" transform="translate(8 82)"/>
  <use href="#sf-bracket" transform="translate(103 82)"/>

  <!-- board -->
  <rect x="1" y="71" width="120" height="11" rx="1.8" fill="#E7BC6E"/>
  <path d="M2.8 71H119.2A1.8 1.8 0 0 1 121 72.8V74H1V72.8A1.8 1.8 0 0 1 2.8 71Z" fill="#F3D391"/>
  <path d="M1 80.2H121A1.8 1.8 0 0 1 119.2 82H2.8A1.8 1.8 0 0 1 1 80.2Z" fill="#D9A650"/>
  <path d="M1.5 74H120.5" stroke="#CF9D45" stroke-width=".8"/>
  <path d="M6 77h12M24 77.6h6M48 76.8h13M70 77.4h5M92 77h17" stroke="#D9A650" stroke-width=".9"/>
  <!-- contact shadows of the cards on the top face -->
  <path d="M5 72.2H37M45 72.2H77M85 72.2H117" stroke="#DDB05E" stroke-width="1.6"/>
  <rect x="1" y="71" width="120" height="11" rx="1.8" stroke="#B98632" stroke-width="1.3"/>

  <!-- cards -->
  <use href="#sf-card" transform="translate(4 6)"/>
  <use href="#sf-card" transform="translate(44 6)"/>
  <use href="#sf-card" transform="translate(84 6)"/>
</svg>
