<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 112" width="94" height="112">
  <!-- Pink upholstered desk chair seen from behind and a little to the left; its seat points right, toward the desk.
       Pink: fill #F4B4C2, shade #EC9DB0, outline #D97F97, highlight #F9CDD5.
       Wood legs: fill #E7BC6E, shade #D9A650, outline #B98632, highlight #F6DDA4.
       Feet: near pair end at y105.6, far pair at y98.6. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="47.6" cy="105.2" rx="40" ry="5" fill="#7A4636" opacity=".12"/>

    <!-- far legs (front pair, nearer the desk) -->
    <path d="M37.2,66 L34.6,97 Q36,99.4 37.8,97.2 L41.6,66.4 Z" fill="#D9A650" stroke="#B98632" stroke-width="1.25"/>
    <path d="M60.4,65 L64.4,97.2 Q66.2,99.4 67.4,97 L64.6,64.6 Z" fill="#D9A650" stroke="#B98632" stroke-width="1.25"/>
    <!-- near legs (back pair), splayed about 7 degrees -->
    <path d="M17.8,62.6 L12.6,104.4 Q14.2,107 16.2,104.8 L23.2,63.8 Z" fill="#E7BC6E" stroke="#B98632" stroke-width="1.25"/>
    <path d="M19.6,67 L14.6,102.6" stroke="#F6DDA4" stroke-width="1" opacity=".7"/>
    <path d="M72.2,61 L78.8,104.8 Q80.6,107.2 82.2,104.6 L77.6,60.2 Z" fill="#E7BC6E" stroke="#B98632" stroke-width="1.25"/>
    <path d="M74.2,65 L79.8,103" stroke="#F6DDA4" stroke-width="1" opacity=".7"/>

    <!-- seat cushion: a soft rounded ledge. Body first (the cushion side), then the lit top plane, then the outline. -->
    <path d="M62,46.6 C71,44.4 81,44.4 87.4,46.8 C91.6,48.4 93,52 92.6,57 C92.4,60.6 92.6,63 91.6,65.2 C89.8,69.4 85.2,72.4 79,74 C74.6,75.1 69.8,73.8 65.6,70.4 Z" fill="#F4B4C2"/>
    <!-- underside of the cushion, turning away from the light -->
    <path d="M67,71.7 C71.6,72.2 76.4,71.4 80.8,70 C86,68.4 89.8,65.8 92.3,62 C92.2,63.2 92,64.2 91.6,65.2 C89.8,69.4 85.2,72.4 79,74 C74.6,75.1 69.8,73.8 65.6,70.4 C66.2,71 66.6,71.4 67,71.7 Z" fill="#EC9DB0"/>
    <!-- top plane of the seat -->
    <path d="M62,46.6 C71,44.4 81,44.4 87.4,46.8 C91.6,48.4 93,52 92.5,55.4 C90.6,58.2 85.8,60 79.4,61.6 C75,62.6 70.2,63.2 65.4,63.3 Z" fill="#F9CDD5"/>
    <!-- the rounded front edge where the top turns down into the cushion side -->
    <path d="M65.4,63.3 C70.2,63.2 75,62.6 79.4,61.6 C85.8,60 90.4,58.2 92.5,55.4" fill="none" stroke="#D97F97" stroke-width="1.1" opacity=".75"/>
    <path d="M68,65.8 C73.6,65.5 79,64.6 84,63" fill="none" stroke="#F9CDD5" stroke-width="1.3" opacity=".9"/>
    <!-- seat silhouette -->
    <path d="M62,46.6 C71,44.4 81,44.4 87.4,46.8 C91.6,48.4 93,52 92.6,57 C92.4,60.6 92.6,63 91.6,65.2 C89.8,69.4 85.2,72.4 79,74 C74.6,75.1 69.8,73.8 65.6,70.4" fill="none" stroke="#D97F97" stroke-width="1.4"/>

    <!-- shell back: silhouette in the light rim tone -->
    <path d="M6.5,20 C5.6,10.6 9.6,4.5 19,4.5 C33,4.5 47,6.6 57.5,11.4 C66,15.4 70.4,24 71.4,36 L72.4,47.6 C71.2,54.6 69.6,62.4 66,70.4 C53,72.6 36,72.4 24,69 C14,66 9.6,59.4 8.8,50.4 C8,40 7.4,30 6.5,20 Z"
      fill="#F9CDD5" stroke="#D97F97" stroke-width="1.4"/>
    <!-- inner face of the shell wrapping toward the seat -->
    <path d="M57.5,11.4 C66,15.4 70.4,24 71.4,36 L72.4,47.6 C71.2,54.6 69.6,62.4 66,70.4 C64.4,70.6 63,70.8 61.6,70.9 C64.4,62.6 65.6,53.8 65.4,45 C65.2,34 62.2,24.6 56.6,18.4 C53,14.4 48.6,12 44,10.4 C48.8,10.4 53.4,10.8 57.5,11.4 Z" fill="#EC9DB0"/>
    <!-- back face -->
    <path d="M8.6,21 C7.8,12.6 11.2,7.6 19.6,7.6 C30,7.6 40,9 48,12.4 C55.4,15.6 60.4,22 62.2,32 C64,42 64.4,56 61.6,70.9 C50,72.4 36,72.2 24.6,69 C15.2,66.2 11.2,60 10.6,51 C9.8,40.6 9.2,31 8.6,21 Z" fill="#F4B4C2"/>
    <!-- shade where the back curves down to the seat -->
    <path d="M11,56 C14.6,63 22,67 32,68.8 C43,70.6 53,70.4 61.6,70.9 C62,67 61.8,63.4 60,61.6 C50,63.6 38,63.4 28,61 C20.6,59.2 15,57.6 11,56 Z" fill="#EC9DB0" opacity=".55"/>
    <!-- light on the upper left of the back -->
    <path d="M13.2,17.4 C14,13 18,11 24.6,10.6 C31.6,10.2 38.6,11 44,12.8 C37.2,12.8 30.4,13.4 25,15.2 C20.4,16.8 17.2,19.4 15.4,24 C14.4,21.6 13.6,19.4 13.2,17.4 Z" fill="#F9CDD5" opacity=".5"/>
    <!-- piping along the rim -->
    <path d="M62.2,32 C64,42 64.4,56 61.6,70.9" fill="none" stroke="#D97F97" stroke-width="1" opacity=".55"/>
  </g>
</svg>
