<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 160" width="196" height="160">
  <!-- Home desk: desk.svg with a taller pedestal of three equal drawers, so each drawer can carry a small plate and be a
       44 pt tall control (top: Help, middle: Send feedback, bottom: Privacy and terms).
       Palette: fill #B7D5B1, shade #9FC49C, outline #7BA67D, highlight #CFE5C9. Pulls: wood #E7BC6E / #B98632.
       Desk top surface: the slab spans y 2-11.6; objects standing on the desk sit with their base at about y 4.
       Drawer faces (flat and plain in their upper part, for a plate): x 107-187, y 16-58, 62-104, 108-150 (80 x 42 each).
       A plate fits at x 112-182, face top + 4 to face top + 28; the pull sits under it at face top + 35.
       Feet: front feet end at y 158, the far-left leg ends at y 154. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- contact shadows on the floor -->
    <ellipse cx="144" cy="157.2" rx="50" ry="3" fill="#7A4636" opacity=".12"/>
    <ellipse cx="9" cy="157.6" rx="9" ry="2.4" fill="#7A4636" opacity=".12"/>
    <ellipse cx="22" cy="154.2" rx="6" ry="1.6" fill="#7A4636" opacity=".12"/>

    <!-- modesty panel at the back of the knee space -->
    <path d="M16,19 H97 V96 Q97,98.6 94.4,98.6 H18.6 Q16,98.6 16,96 Z" fill="#9FC49C" stroke="#7BA67D" stroke-width="1.25"/>
    <rect x="16.7" y="19.6" width="80" height="3.2" fill="#7BA67D" opacity=".28"/>
    <line x1="22" y1="95.6" x2="94" y2="95.6" stroke="#B7D5B1" stroke-width="1" opacity=".7"/>

    <!-- far-left leg, seen through the knee space -->
    <path d="M18.5,19 H25 V147 L24.4,153.4 Q21.75,155 19.1,153.4 L18.5,147 Z" fill="#9FC49C" stroke="#7BA67D" stroke-width="1.25"/>
    <line x1="20.6" y1="26" x2="20.6" y2="144" stroke="#B7D5B1" stroke-width="1" opacity=".7"/>

    <!-- apron rail across the knee space, tucked under the slab -->
    <path d="M10,11.6 H98 V19.6 H10 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
    <rect x="10.6" y="12.2" width="86.8" height="1.8" fill="#9FC49C"/>
    <line x1="13" y1="17.6" x2="96" y2="17.6" stroke="#CFE5C9" stroke-width="1" opacity=".9"/>

    <!-- front-left leg -->
    <path d="M3.6,11.6 H13.4 V138 L12.2,157.4 Q8.5,159.1 4.8,157.4 L3.6,138 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <path d="M10.2,12.4 H13.4 V138 L12.2,157.4 Q10.9,158.1 9.4,158.4 L10.2,138 Z" fill="#9FC49C"/>
    <line x1="6.2" y1="16" x2="6.2" y2="136" stroke="#CFE5C9" stroke-width="1.1" opacity=".8"/>

    <!-- pedestal carcass -->
    <path d="M96,11.6 H192 V151 Q192,154.5 188.5,154.5 H99.5 Q96,154.5 96,151 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <path d="M96,11.6 H102 V154.5 H99.5 Q96,154.5 96,151 Z" fill="#9FC49C"/>
    <line x1="102" y1="12" x2="102" y2="154" stroke="#7BA67D" stroke-width="1" opacity=".55"/>
    <rect x="102.6" y="12.2" width="88.8" height="1.8" fill="#9FC49C"/>
    <rect x="102.6" y="150.8" width="88.8" height="3.2" fill="#9FC49C"/>

    <!-- three drawers: flat upper face for a plate, a small pull below it -->
    <g id="drawer">
      <rect x="107" y="16" width="80" height="42" rx="2.5" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
      <line x1="110.5" y1="17.9" x2="183.5" y2="17.9" stroke="#CFE5C9" stroke-width="1.1" opacity=".95"/>
      <line x1="110.5" y1="56.2" x2="183.5" y2="56.2" stroke="#9FC49C" stroke-width="1.3"/>
      <path d="M140,51.6 H154" stroke="#7BA67D" stroke-width="3.6" opacity=".3"/>
      <path d="M140.4,50.6 H153.6" stroke="#B98632" stroke-width="3.8"/>
      <path d="M140.4,50.6 H153.6" stroke="#E7BC6E" stroke-width="2"/>
      <path d="M142,50 H146" stroke="#FAE7B8" stroke-width=".9"/>
    </g>
    <use href="#drawer" y="46"/>
    <use href="#drawer" y="92"/>

    <!-- short tapered feet under the pedestal -->
    <path d="M98.5,154 H109 L108,157.4 Q103.75,159.1 99.5,157.4 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <path d="M179.5,154 H190 L189,157.4 Q184.75,159.1 180.5,157.4 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>

    <!-- top slab: front edge (slightly darker), then the lit top face. 9.6 units in all. -->
    <path d="M1,6 H195 V9.6 Q195,11.6 193,11.6 H3 Q1,11.6 1,9.6 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <line x1="4" y1="7.7" x2="192" y2="7.7" stroke="#CFE5C9" stroke-width="1" opacity=".9"/>
    <path d="M5,2 H191 Q193.4,2 194,4 L195,6 H1 L2,4 Q2.6,2 5,2 Z" fill="#CFE5C9" stroke="#7BA67D" stroke-width="1.4"/>
  </g>
</svg>
