<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 44" width="48" height="44" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Small blue travel case (the blue case from the Suitcases room) for the Suitcases tile, standing on a floor line at y 40.4.
       Blue: fill #A9CBEF, shade #8FB8E6, outline #6C9AD0, highlight #C9E0F6; handle #7EA6DA / #557FB6. Straps cream #FFF7EA / #D9C6A5. Fittings wood #E7BC6E / #B98632. -->
  <defs>
    <clipPath id="cs-body"><rect x="4" y="14" width="40" height="26" rx="4.5"/></clipPath>
  </defs>
  <ellipse cx="24" cy="41.4" rx="21" ry="1.9" fill="#8A5A48" opacity=".13"/>
  <!-- feet -->
  <rect x="8.6" y="38.6" width="4.4" height="2.8" rx="1" fill="#D9A650" stroke="#B98632" stroke-width="1"/>
  <rect x="35" y="38.6" width="4.4" height="2.8" rx="1" fill="#D9A650" stroke="#B98632" stroke-width="1"/>
  <!-- handle -->
  <path d="M18.4 14.6 V11.6 Q18.4 8 22 8 H26 Q29.6 8 29.6 11.6 V14.6" stroke="#557FB6" stroke-width="4.2"/>
  <path d="M18.4 14.6 V11.6 Q18.4 8 22 8 H26 Q29.6 8 29.6 11.6 V14.6" stroke="#7EA6DA" stroke-width="2"/>
  <path d="M20.6 9.6 Q21.4 9 22.6 9" stroke="#C9E0F6" stroke-width=".9"/>
  <rect x="16.6" y="12.6" width="3.6" height="2.6" rx=".8" fill="#E7BC6E" stroke="#B98632" stroke-width=".9"/>
  <rect x="27.8" y="12.6" width="3.6" height="2.6" rx=".8" fill="#E7BC6E" stroke="#B98632" stroke-width=".9"/>
  <!-- body -->
  <rect x="4" y="14" width="40" height="26" rx="4.5" fill="#A9CBEF"/>
  <g clip-path="url(#cs-body)">
    <rect x="0" y="34.2" width="48" height="8" fill="#8FB8E6"/>
    <rect x="38.4" y="14" width="8" height="28" fill="#8FB8E6" opacity=".55"/>
  </g>
  <path d="M8.2 17 H14" stroke="#C9E0F6" stroke-width="1.2"/>
  <path d="M5.2 21 H42.8" stroke="#6C9AD0" stroke-width="1.1"/>
  <path d="M5.4 22.4 H42.6" stroke="#C9E0F6" stroke-width=".8" opacity=".8"/>
  <rect x="4" y="14" width="40" height="26" rx="4.5" stroke="#6C9AD0" stroke-width="1.4"/>
  <!-- straps with buckles -->
  <rect x="11" y="13.5" width="5" height="27" rx="1" fill="#FFF7EA" stroke="#D9C6A5" stroke-width="1.1"/>
  <rect x="32" y="13.5" width="5" height="27" rx="1" fill="#FFF7EA" stroke="#D9C6A5" stroke-width="1.1"/>
  <path d="M12.2 34.6 H14.8 M33.2 34.6 H35.8" stroke="#F3E6D0" stroke-width="1.6"/>
  <rect x="10.4" y="23.6" width="6.2" height="4.6" rx="1" fill="#E7BC6E" stroke="#B98632" stroke-width="1"/>
  <rect x="31.4" y="23.6" width="6.2" height="4.6" rx="1" fill="#E7BC6E" stroke="#B98632" stroke-width="1"/>
  <path d="M13.5 24.6 V27.2 M34.5 24.6 V27.2" stroke="#B98632" stroke-width=".9"/>
  <!-- latch -->
  <rect x="22" y="19.4" width="4" height="3.4" rx=".9" fill="#E7BC6E" stroke="#B98632" stroke-width=".9"/>
</svg>
