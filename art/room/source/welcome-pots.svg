<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 66" width="48" height="66" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Small pot by the front door: a rounded leafy mound with cream daisies, in a pink pot that matches plant-floor.svg.
       Leaf #77AE84 / #5C9670 / outline #44795A / highlight #93C29D. Pot #F4B4C2 / #EC9DB0 / #D97F97 / #F9CDD5.
       Daisy petals cream #FFF7EA outlined #D9C6A5, butter centres. Pot base sits on y 62. Ids are prefixed wp-. -->
  <defs>
    <g id="wp-daisy">
      <g fill="#FFF7EA" stroke="#D9C6A5" stroke-width=".8">
        <ellipse cx="0" cy="-2.5" rx="1.5" ry="2.2"/>
        <ellipse cx="0" cy="-2.5" rx="1.5" ry="2.2" transform="rotate(72)"/>
        <ellipse cx="0" cy="-2.5" rx="1.5" ry="2.2" transform="rotate(144)"/>
        <ellipse cx="0" cy="-2.5" rx="1.5" ry="2.2" transform="rotate(216)"/>
        <ellipse cx="0" cy="-2.5" rx="1.5" ry="2.2" transform="rotate(288)"/>
      </g>
      <circle r="1.5" fill="#FBE9A6" stroke="#DDBB4E" stroke-width=".8"/>
    </g>
    <clipPath id="wp-mound"><path d="M7.4 36.6C3.6 33 4.2 26.2 9.6 24.6C9.2 18 15.4 13.6 21 15.8C23.8 10.4 32.4 10.8 34.2 17C40.6 17.6 43.6 24.4 40.6 29C43.2 32 42 36 39.4 37.2Z"/></clipPath>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="24" cy="62.4" rx="15" ry="2.6" fill="#7A4636" opacity=".13"/>

  <!-- leafy mound -->
  <path d="M7.4 36.6C3.6 33 4.2 26.2 9.6 24.6C9.2 18 15.4 13.6 21 15.8C23.8 10.4 32.4 10.8 34.2 17C40.6 17.6 43.6 24.4 40.6 29C43.2 32 42 36 39.4 37.2Z" fill="#77AE84"/>
  <g clip-path="url(#wp-mound)">
    <path d="M44 22C40 30 30 35 4 36V40H44Z" fill="#5C9670" opacity=".7"/>
  </g>
  <!-- leaf lobes and veins -->
  <path d="M9.6 24.6C12 25 14 26.6 14.8 29M21 15.8C22.6 17.2 23.4 19.4 23.2 21.8M34.2 17C32.4 18.4 31.6 20.6 31.8 23M40.6 29C38.6 28.6 36.4 29.2 35 30.6" stroke="#44795A" stroke-width="1"/>
  <path d="M11.6 22.2C12.4 20 14.2 18.6 16.4 18.2M24.6 14.2C26.6 13.2 29 13.4 30.8 14.6" stroke="#93C29D" stroke-width="1.1"/>
  <path d="M7.4 36.6C3.6 33 4.2 26.2 9.6 24.6C9.2 18 15.4 13.6 21 15.8C23.8 10.4 32.4 10.8 34.2 17C40.6 17.6 43.6 24.4 40.6 29C43.2 32 42 36 39.4 37.2Z" stroke="#44795A" stroke-width="1.25"/>

  <!-- daisies -->
  <use href="#wp-daisy" x="14" y="23.4"/>
  <use href="#wp-daisy" x="27.4" y="18.6"/>
  <use href="#wp-daisy" x="35.6" y="27.6"/>
  <use href="#wp-daisy" x="21.6" y="30.2"/>
  <use href="#wp-daisy" x="9.6" y="32"/>

  <!-- pot: rim with its shade, tapered body, side shade and a highlight -->
  <path d="M10.6 39.6H37.4L34.4 59.8Q34.1 61.6 32.4 61.6H15.6Q13.9 61.6 13.6 59.8Z" fill="#F4B4C2" stroke="#D97F97" stroke-width="1.3"/>
  <path d="M29.6 40.4H37.2L34.4 59.8Q34.1 61.4 32.4 61.4H28.4Z" fill="#EC9DB0"/>
  <path d="M14.8 43.4L16.6 57.6" stroke="#F9CDD5" stroke-width="1.3"/>
  <path d="M11.4 40.8H36.6" stroke="#EC9DB0" stroke-width="1.6"/>
  <rect x="8" y="34.4" width="32" height="6" rx="1.6" fill="#F4B4C2" stroke="#D97F97" stroke-width="1.3"/>
  <path d="M10.6 36.2H34" stroke="#F9CDD5" stroke-width="1"/>
  <path d="M32 35.2H39.2V39.6H32Z" fill="#EC9DB0" opacity=".7"/>
  <rect x="8" y="34.4" width="32" height="6" rx="1.6" stroke="#D97F97" stroke-width="1.3"/>
</svg>
