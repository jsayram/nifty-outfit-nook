       Body x 4..100, y 10..177.6, with the shoulder straps just showing at x 1..4 and 100..103; the side band is x 92..100.
       Plain face for the live-text plates: x 4..92, y 30..76 and x 2..102, y 81..121.
       The tag strap loops round the grab loop and comes straight down into (48, 30). Base rests on y 178.6; contact shadow to y 182. -->
