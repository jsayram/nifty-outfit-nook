<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 182" width="104" height="182" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Backpack seen from the front: rounded top, grab loop, a top flap with two buckle straps, a zip pocket below. Ids are prefixed sbp-.
