<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 64" width="92" height="64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Open laptop, front view. Screen x 6..86, y 5..50 is flat plum for an overlaid label. Deck bottom at y 62.4.
       Silver set: fill #EEF0F5, shade #CBD0DE, outline #A4AABD; key well #8A8DA6; highlights white. -->

  <!-- keyboard deck -->
  <path d="M6 52H86L90.6 59.4C91.4 60.8 90.6 62.4 89 62.4H3C1.4 62.4.6 60.8 1.4 59.4Z" fill="#EEF0F5"/>
  <!-- front edge -->
  <path d="M1.2 60H90.8C91.2 61.3 90.4 62.4 89 62.4H3C1.6 62.4.8 61.3 1.2 60Z" fill="#CBD0DE"/>
  <!-- key well with two rows of keys -->
  <path d="M11.4 54.2H80.6L82.8 58H9.2Z" fill="#8A8DA6"/>
  <path d="M12.8 55.3H79.2" stroke="#CBD0DE" stroke-width="1" stroke-dasharray="2.4 1" stroke-linecap="butt"/>
  <path d="M11.6 56.9H80.4" stroke="#CBD0DE" stroke-width="1" stroke-dasharray="2.4 1" stroke-dashoffset="1.2" stroke-linecap="butt"/>
  <!-- trackpad: a lighter panel with a fine detail edge -->
  <path d="M38.2 58.6H53.8L54.4 60H37.6Z" fill="#FFFFFF"/>
  <path d="M38.2 58.6H53.8L54.4 60H37.6Z" stroke="#CBD0DE" stroke-width=".7"/>
  <!-- highlight along the top of the deck -->
  <path d="M8 52.8H84" stroke="#FFFFFF" stroke-width=".8"/>
  <path d="M6 52H86L90.6 59.4C91.4 60.8 90.6 62.4 89 62.4H3C1.4 62.4.6 60.8 1.4 59.4Z" stroke="#A4AABD" stroke-width="1.3"/>

  <!-- lid -->
  <rect x="3" y="2" width="86" height="51.4" rx="4" fill="#EEF0F5"/>
  <!-- lid shade along the right and bottom bezel -->
  <path d="M86 5V50H6V52.4H85.4A2.6 2.6 0 0 0 88 49.8V5Z" fill="#CBD0DE" opacity=".7"/>
  <path d="M4.6 48V6.2A2.6 2.6 0 0 1 7.2 3.6H72" stroke="#FFFFFF" stroke-width=".9"/>
  <rect x="3" y="2" width="86" height="51.4" rx="4" stroke="#A4AABD" stroke-width="1.3"/>
  <!-- hinge: a darker band where the lid meets the deck, with a fine line under it -->
  <rect x="30" y="51.8" width="32" height="2.2" rx="1.1" fill="#CBD0DE"/>
  <path d="M31.4 53.9H60.6" stroke="#A4AABD" stroke-width=".7"/>

  <!-- screen -->
  <rect x="6" y="5" width="80" height="45" rx="1.6" fill="#6A1F58"/>
  <!-- camera -->
  <circle cx="46" cy="3.5" r=".6" fill="#A4AABD"/>
</svg>
