<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 78" width="64" height="78" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Small round wall mirror for the entry hall, hung from a brass nail on a pink ribbon. Ids are prefixed tm-.
       Frame lilac #D8C6F0 / #C3ABE6 / #A98CD6 with highlight #EDE3FA, glass #EFE8FA to #DCD0F2 as in mirror.svg.
       Nail at (32, 4). Frame centre (32, 46), outer radius 30, glass radius 23. No label zone. -->
  <defs>
    <linearGradient id="tm-glass" x1="0" y1="23" x2="0" y2="69" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFE8FA"/>
      <stop offset="1" stop-color="#DCD0F2"/>
    </linearGradient>
    <clipPath id="tm-clip"><circle cx="32" cy="46" r="23"/></clipPath>
  </defs>

  <!-- ribbon from the nail to the top of the frame -->
  <path d="M32 4.6L21 22M32 4.6L43 22" stroke="#D97F97" stroke-width="3"/>
  <path d="M32 4.6L21 22M32 4.6L43 22" stroke="#F4B4C2" stroke-width="1.6"/>
  <circle cx="32" cy="4.2" r="2.6" fill="#E7BC6E" stroke="#B98632" stroke-width="1.1"/>

  <!-- frame -->
  <circle cx="32" cy="46" r="30" fill="#D8C6F0" stroke="#A98CD6" stroke-width="1.5"/>
  <path d="M52.6 67.6A28 28 0 0 1 10.4 64.6" stroke="#C3ABE6" stroke-width="2.6"/>
  <path d="M6.6 38A27 27 0 0 1 40 20.2" stroke="#EDE3FA" stroke-width="1.5"/>
  <circle cx="32" cy="46" r="26.4" stroke="#C3ABE6" stroke-width=".7" opacity=".9"/>

  <!-- glass with two soft highlight streaks -->
  <circle cx="32" cy="46" r="23" fill="url(#tm-glass)"/>
  <g clip-path="url(#tm-clip)">
    <path d="M14 58L44 24L50 28L20 62Z" fill="#FFFFFF" opacity=".5"/>
    <path d="M24 66L54 32L56 35L27 68Z" fill="#FFFFFF" opacity=".4"/>
  </g>
  <circle cx="32" cy="46" r="23" stroke="#A98CD6" stroke-width="1.3"/>

  <!-- ribbon ends tucked behind small bows on the frame top -->
  <circle cx="21.4" cy="21.6" r="2.2" fill="#F4B4C2" stroke="#D97F97" stroke-width="1"/>
  <circle cx="42.6" cy="21.6" r="2.2" fill="#F4B4C2" stroke="#D97F97" stroke-width="1"/>
</svg>
