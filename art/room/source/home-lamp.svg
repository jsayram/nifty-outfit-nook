  <path d="M22 72.9C25.2 72.9 27.8 73.6 27.8 74.6V75C27.8 75.5 27.4 75.8 26.9 75.8H22Z" fill="#D9A650"/>
  <path d="M16.2 74.6C16.2 73.6 18.8 72.9 22 72.9C25.2 72.9 27.8 73.6 27.8 74.6V75C27.8 75.5 27.4 75.8 26.9 75.8H17.1C16.6 75.8 16.2 75.5 16.2 75Z" stroke="#B98632" stroke-width="1.25"/>

  <!-- stem -->
  <rect x="20.2" y="25.4" width="3.6" height="47.8" fill="#E7BC6E"/>
  <rect x="22.3" y="25.4" width="1.5" height="47.8" fill="#D9A650"/>
