<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 80" width="44" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Tall table lamp for the Style Me desk: the kit's lamp.svg with a 16-unit longer stem and a mid collar, so the shade
