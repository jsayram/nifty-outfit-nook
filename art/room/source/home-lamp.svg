  <path d="M20.2 26.4V73.2M23.8 26.4V73.2" stroke="#B98632" stroke-width="1.25"/>
  <!-- mid collar -->
  <rect x="19.1" y="48.6" width="5.8" height="3.6" rx="1.5" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
  <path d="M22.6 49.2V51.6" stroke="#D9A650" stroke-width="1.2"/>
