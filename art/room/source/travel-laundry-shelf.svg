<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 76" width="224" height="76" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Laundry shelf: a wood board on two brackets with a stack of folded towels (pink, cream, blue) on the left,
       a small sage stain-remover spray in the middle (x 109..127) and a lilac detergent bottle with a pink cap on the right. Ids are prefixed tl-.
       Wood #E7BC6E / #D9A650 / #B98632, highlight #F3D391. Lilac #D8C6F0 / #C3ABE6 / #A98CD6, highlight #EDE3FA.
       Board x 2..222, y 50..61 (top face 50..53), the same 11-unit profile as shelf-top. Brackets x 6..17 and 207..218, y 61..74.
       Plate zone under the board, between the brackets: x 19..205, y 59..95. Things stand on y 50. -->
  <defs>
    <g id="tl-bracket">
      <path d="M0 0H11L9.6 10.6C9.4 12 8.5 13 7.1 13H3.9C2.5 13 1.6 12 1.4 10.6Z" fill="#E7BC6E"/>
      <path d="M6.4 0H11L9.6 10.6C9.4 12 8.5 13 7.1 13H5.9Z" fill="#D9A650"/>
      <path d="M0 0H11L10.75 2.4H.25Z" fill="#D9A650"/>
      <path d="M3.2 4.2L3.5 10.2" stroke="#F3D391" stroke-width="1.1"/>
      <path d="M0 0H11L9.6 10.6C9.4 12 8.5 13 7.1 13H3.9C2.5 13 1.6 12 1.4 10.6Z" stroke="#B98632" stroke-width="1.3"/>
      <circle cx="5.5" cy="6.6" r=".9" fill="#B98632"/>
    </g>
    <clipPath id="tl-bottle"><path d="M166 49Q164 49 164 46V27Q164 22 168 20L172 18V15H180V18L190 18.6Q196.4 19.6 196.4 26V46Q196.4 49 193.4 49Z"/></clipPath>
  </defs>

  <!-- brackets -->
  <use href="#tl-bracket" transform="translate(6 61)"/>
  <use href="#tl-bracket" transform="translate(207 61)"/>

  <!-- board -->
  <rect x="2" y="50" width="220" height="11" rx="1.8" fill="#E7BC6E"/>
  <path d="M3.8 50H220.2A1.8 1.8 0 0 1 222 51.8V53H2V51.8A1.8 1.8 0 0 1 3.8 50Z" fill="#F3D391"/>
  <path d="M2 59.2H222A1.8 1.8 0 0 1 220.2 61H3.8A1.8 1.8 0 0 1 2 59.2Z" fill="#D9A650"/>
  <path d="M2.5 53H221.5" stroke="#CF9D45" stroke-width=".8"/>
  <path d="M10 56h14M40 56.6h8M70 55.8h12M110 56.4h10M142 56h14M178 56.6h8M200 55.8h12" stroke="#D9A650" stroke-width=".9"/>
  <!-- shadows of the towels and the bottle on the top face -->
  <ellipse cx="49" cy="51.4" rx="28" ry="1.2" fill="#DDB05E"/>
  <ellipse cx="180" cy="51.4" rx="17" ry="1.2" fill="#DDB05E"/>
  <ellipse cx="120" cy="51.4" rx="11" ry="1.1" fill="#DDB05E"/>
  <rect x="2" y="50" width="220" height="11" rx="1.8" stroke="#B98632" stroke-width="1.3"/>

  <!-- folded towels: blue at the bottom, cream, pink on top. The rounded left end is the fold. -->
  <!-- blue -->
  <path d="M29 39H76V50H29Q23.4 50 23.4 44.5Q23.4 39 29 39Z" fill="#A9CBEF"/>
  <path d="M23.6 46.2Q25 50 29 50H76V46.2Z" fill="#8FB8E6"/>
  <rect x="62" y="39" width="4.4" height="11" fill="#C4DCF5"/>
