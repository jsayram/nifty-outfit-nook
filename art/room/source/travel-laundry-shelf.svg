  <path d="M29 39H76V50H29Q23.4 50 23.4 44.5Q23.4 39 29 39Z" stroke="#6C9AD0" stroke-width="1.25"/>
  <path d="M30.4 41.6Q28 44.5 30.4 47.4" stroke="#6C9AD0" stroke-width="1" opacity=".7"/>
  <!-- cream -->
