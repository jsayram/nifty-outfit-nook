  <path d="M27.6 17H73.6V28H27.6Q22 28 22 22.5Q22 17 27.6 17Z" stroke="#D97F97" stroke-width="1.25"/>
  <path d="M29 19.6Q26.6 22.5 29 25.4" stroke="#D97F97" stroke-width="1" opacity=".7"/>

