  <path d="M114.6 27.2L112.9 32.6Q113 33.6 114.1 33.2L116.6 27.8Z" fill="#FFF7EA" stroke="#D9C6A5" stroke-width="1"/>
  <rect x="117" y="27.6" width="6.4" height="4.4" rx="1" fill="#F3E6D0" stroke="#D9C6A5" stroke-width="1"/>
  <rect x="109.2" y="21.4" width="4.6" height="3.6" rx="1.1" fill="#F3E6D0" stroke="#D9C6A5" stroke-width="1"/>
  <path d="M113 22.2Q113 19.6 115.6 19.6H122.6Q125.4 19.6 125.4 22.4V25.2Q125.4 28 122.6 28H115.6Q113 28 113 25.4Z" fill="#FFF7EA"/>
  <path d="M121.6 19.8V27.8H122.6Q125.4 27.8 125.4 25.2V22.4Q125.4 19.8 122.6 19.8Z" fill="#F3E6D0"/>
  <path d="M113 22.2Q113 19.6 115.6 19.6H122.6Q125.4 19.6 125.4 22.4V25.2Q125.4 28 122.6 28H115.6Q113 28 113 25.4Z" stroke="#D9C6A5" stroke-width="1.1"/>
