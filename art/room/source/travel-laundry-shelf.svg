  <path d="M116.4 35.2V46.6" stroke="#D4E8CF" stroke-width="1.4"/>
  <rect x="117.6" y="37.6" width="7" height="7.6" rx="1.6" fill="#F2F8EF" stroke="#7BA67D" stroke-width=".8"/>
  <path d="M119.4 40.4H122.8M119.4 42.6H121.8" stroke="#9FC49C" stroke-width=".9"/>
  <path d="M114 34.4Q114 31.8 116.6 31.8H123.8Q126.4 31.8 126.4 34.4V47.4Q126.4 50 123.8 50H116.6Q114 50 114 47.4Z" stroke="#7BA67D" stroke-width="1.2"/>

  <!-- detergent bottle: lilac jug, handle hole at the back, pink cap, a plain label with three bubbles -->
  <rect x="171" y="10.4" width="10" height="5.6" rx="1.6" fill="#F4B4C2" stroke="#D97F97" stroke-width="1.1"/>
  <path d="M174 11.8V14.6M176 11.8V14.6M178 11.8V14.6" stroke="#D97F97" stroke-width=".9"/>
  <path fill-rule="evenodd" d="M166 49Q164 49 164 46V27Q164 22 168 20L172 18V15H180V18L190 18.6Q196.4 19.6 196.4 26V46Q196.4 49 193.4 49Z M184.6 22.6H190.2Q191.8 22.6 191.8 24.2V27.4Q191.8 29 190.2 29H184.6Q183 29 183 27.4V24.2Q183 22.6 184.6 22.6Z" fill="#D8C6F0"/>
  <g clip-path="url(#tl-bottle)">
    <path d="M190.6 18V50H200V18Z" fill="#C3ABE6"/>
    <path d="M167.6 27V45" stroke="#EDE3FA" stroke-width="1.6"/>
  </g>
  <rect x="168.4" y="31.4" width="19.6" height="13.4" rx="2.6" fill="#F7F2FD" stroke="#A98CD6" stroke-width=".9"/>
  <circle cx="174.4" cy="39.6" r="2.6" stroke="#A98CD6" stroke-width=".9"/>
  <circle cx="180.6" cy="36" r="1.8" stroke="#A98CD6" stroke-width=".9"/>
  <circle cx="182.6" cy="40.8" r="1.3" stroke="#A98CD6" stroke-width=".9"/>
  <path fill-rule="evenodd" d="M166 49Q164 49 164 46V27Q164 22 168 20L172 18V15H180V18L190 18.6Q196.4 19.6 196.4 26V46Q196.4 49 193.4 49Z M184.6 22.6H190.2Q191.8 22.6 191.8 24.2V27.4Q191.8 29 190.2 29H184.6Q183 29 183 27.4V24.2Q183 22.6 184.6 22.6Z" stroke="#A98CD6" stroke-width="1.25"/>
