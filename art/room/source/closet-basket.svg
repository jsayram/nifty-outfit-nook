<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 44" width="48" height="44" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Wicker laundry basket for the Laundry tile, standing on a floor line at y 40.4, with the two pieces that are
       in the wash peeking over the rim: the black tee (left) and the white lace top (right).
       Wicker: wood fill #E7BC6E, shade #D9A650, outline #B98632, highlight #F6DC9C.
       Tee tones from garments.js: #2E2A30 / #4E4853 / #131115. Lace top: #FFFDF8 / #F0E7D6 / #C6AA80. -->
  <defs>
    <clipPath id="cb-body"><path d="M7.4 18.6 H40.6 L38.2 38.6 Q37.9 40.4 36 40.4 H12 Q10.1 40.4 9.8 38.6 Z"/></clipPath>
  </defs>
  <ellipse cx="24" cy="41.4" rx="19" ry="1.9" fill="#8A5A48" opacity=".13"/>

  <!-- black tee, a sleeve and shoulder over the back of the rim -->
  <path d="M9.6 17.6 C9.4 13.4 11.6 10.4 15.4 9.4 L19.6 8.6 C21 10.2 23 10.6 24.6 10 L26.4 17.6 Z" fill="#2E2A30" stroke="#131115" stroke-width="1.2"/>
  <path d="M12.4 15.6 C12.8 13.2 14 11.8 15.8 11.2" stroke="#4E4853" stroke-width="1.1"/>
  <path d="M19.6 8.6 C21 10.2 23 10.6 24.6 10" stroke="#5A535F" stroke-width="1"/>
  <!-- lace top, bunched on the right -->
  <path d="M21.6 17.6 C22 12.6 25.6 8.8 30.6 8 C34.6 7.4 38.4 9.2 39.4 12.6 C40 14.6 39.6 16.4 38.6 17.6 Z" fill="#FFFDF8" stroke="#C6AA80" stroke-width="1.2"/>
  <path d="M33.6 11 C35.6 11.6 37 13.2 37.4 15.4" stroke="#F0E7D6" stroke-width="1.4"/>
  <path d="M26 14.2 h.01 M28.4 12 h.01 M30.6 14.6 h.01 M33 12.6 h.01 M35.2 15.2 h.01 M28.2 16.2 h.01 M31.6 10.2 h.01" stroke="#D6C09C" stroke-width="1.3"/>
  <path d="M24.6 16.4 C25.6 15.2 26.6 15.4 27.4 16.4 C28.2 15.2 29.2 15.4 30 16.4" stroke="#C6AA80" stroke-width=".8"/>

  <!-- basket body -->
  <path d="M7.4 18.6 H40.6 L38.2 38.6 Q37.9 40.4 36 40.4 H12 Q10.1 40.4 9.8 38.6 Z" fill="#E7BC6E"/>
  <g clip-path="url(#cb-body)">
    <rect x="33" y="18" width="10" height="24" fill="#D9A650"/>
    <!-- weave: rows and staggered ticks -->
    <path d="M6 24.6 H42 M6 30.2 H42 M6 35.6 H42" stroke="#C9963F" stroke-width="1"/>
    <path d="M12 20 V24 M18 20 V24 M24 20 V24 M30 20 V24 M36 20 V24 M15 25.6 V29.4 M21 25.6 V29.4 M27 25.6 V29.4 M33 25.6 V29.4 M12 31 V35 M18 31 V35 M24 31 V35 M30 31 V35 M36 31 V35 M15 36.4 V40 M21 36.4 V40 M27 36.4 V40 M33 36.4 V40" stroke="#D9A650" stroke-width="1.1"/>
    <path d="M11 26 L12 33" stroke="#F6DC9C" stroke-width="1.2"/>
  </g>
  <path d="M7.4 18.6 H40.6 L38.2 38.6 Q37.9 40.4 36 40.4 H12 Q10.1 40.4 9.8 38.6 Z" stroke="#B98632" stroke-width="1.4"/>
  <!-- handle slots -->
  <rect x="11.4" y="21.4" width="5.2" height="2.2" rx="1.1" fill="#B98632"/>
  <rect x="31.4" y="21.4" width="5.2" height="2.2" rx="1.1" fill="#B98632"/>
  <!-- rim -->
  <rect x="5.6" y="15.6" width="36.8" height="4.6" rx="2.3" fill="#E7BC6E" stroke="#B98632" stroke-width="1.3"/>
  <path d="M8.4 17.2 H30" stroke="#F6DC9C" stroke-width="1"/>
  <path d="M12 15.8 L13.6 20 M18 15.8 L19.6 20 M24 15.8 L25.6 20 M30 15.8 L31.6 20 M36 15.8 L37.6 20" stroke="#D9A650" stroke-width=".9"/>
</svg>
