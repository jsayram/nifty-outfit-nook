<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 90" width="104" height="90" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Peg rail for the entry hall, with a canvas tote hanging from the right peg. Ids are prefixed th-.
       Wood #E7BC6E / #D9A650 / #B98632, highlight #F3D391. Tote cream #FFF7EA / #F3E6D0 / #D9C6A5 with pink #F4B4C2 / #EC9DB0 / #D97F97.
       Board x 2..100, y 6..19. Peg centres (36, 12.5) and (80, 12.5), knob radius 4.4.
       The left peg is left bare for a coat on a hanger (garments.js): put the hanger's hook loop (60, 11) on (36, 12.5),
       then lay travel-hall-peg.svg over the peg so the knob sits in front of the hook. The tote (x 60..99.6) hangs to y 84.6
       and is drawn here, so a coat placed after this image hangs in front of the tote's left side. -->
  <defs>
    <g id="th-knob">
      <ellipse cx=".8" cy="1.2" rx="4.6" ry="4.4" fill="#B98632" opacity=".28"/>
      <circle r="4.4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.3"/>
      <path d="M1.2 3.4A3.6 3.6 0 0 0 3.6 .2" stroke="#D9A650" stroke-width="1.4"/>
      <path d="M-2.4 -.6A2.6 2.6 0 0 1 -.4 -2.6" stroke="#FBE7B1" stroke-width="1.3"/>
    </g>
  </defs>

  <!-- board -->
  <rect x="2" y="6" width="98" height="13" rx="1.8" fill="#E7BC6E"/>
  <path d="M3.8 6H98.2A1.8 1.8 0 0 1 100 7.8V8.8H2V7.8A1.8 1.8 0 0 1 3.8 6Z" fill="#F3D391"/>
  <path d="M2 17H100A1.8 1.8 0 0 1 98.2 19H3.8A1.8 1.8 0 0 1 2 17Z" fill="#D9A650"/>
  <path d="M2.5 8.8H99.5" stroke="#CF9D45" stroke-width=".8"/>
  <path d="M14 12.4h10M52 13h12M88 12.2h3" stroke="#D9A650" stroke-width=".9"/>
  <rect x="2" y="6" width="98" height="13" rx="1.8" stroke="#B98632" stroke-width="1.3"/>
  <circle cx="7.4" cy="12.6" r="1.3" fill="#B98632"/>
  <circle cx="94.6" cy="12.6" r="1.3" fill="#B98632"/>

  <g transform="translate(-4 0)">
  <!-- tote handles, looped over the right peg -->
  <path d="M80.6 11.2C78 18 73.4 27 71.4 35.6M87.4 11.2C90 18 94.6 27 95.6 35.6" stroke="#D97F97" stroke-width="4.2"/>
  <path d="M80.6 11.2C78 18 73.4 27 71.4 35.6M87.4 11.2C90 18 94.6 27 95.6 35.6" stroke="#F4B4C2" stroke-width="2.4"/>
  <path d="M80.4 9.4Q84 6.6 87.6 9.4" stroke="#D97F97" stroke-width="4.2"/>
  <path d="M80.4 9.4Q84 6.6 87.6 9.4" stroke="#F4B4C2" stroke-width="2.4"/>

  <!-- the right peg, in front of the handles -->
  <use href="#th-knob" x="84" y="12.5"/>

  <!-- tote body -->
  <path d="M66 34H102L103.6 80.4Q103.8 84.6 99.6 84.6H68.4Q64.2 84.6 64.4 80.4Z" fill="#FFF7EA"/>
  <path d="M96.4 34H102L103.6 80.4Q103.8 84.6 99.6 84.6H97.6Z" fill="#F3E6D0"/>
  <path d="M66.2 38.6H101.8" stroke="#D9C6A5" stroke-width="1" opacity=".8"/>
  <path d="M69.6 42V76" stroke="#FFFFFF" stroke-width="1.6"/>
  <!-- pink band -->
  <path d="M64.9 58.6H103L103.3 67.4H64.7Z" fill="#F4B4C2"/>
  <path d="M96.6 58.6H103L103.3 67.4H97Z" fill="#EC9DB0"/>
  <path d="M64.9 58.6H103M64.7 67.4H103.3" stroke="#D97F97" stroke-width="1"/>
  <!-- soft creases -->
  <path d="M78 70.6C77.4 74 77.6 78 78.4 81.4M89.6 41.4C90 45 89.8 50 89.2 54" stroke="#E6D6BC" stroke-width="1"/>
  <path d="M66 34H102L103.6 80.4Q103.8 84.6 99.6 84.6H68.4Q64.2 84.6 64.4 80.4Z" stroke="#D9C6A5" stroke-width="1.4"/>
  <!-- stitched handle tabs -->
  <rect x="69.2" y="33.4" width="4.6" height="5.2" rx="1" fill="#F4B4C2" stroke="#D97F97" stroke-width="1"/>
  <rect x="93.4" y="33.4" width="4.6" height="5.2" rx="1" fill="#F4B4C2" stroke="#D97F97" stroke-width="1"/>
  </g>
</svg>
