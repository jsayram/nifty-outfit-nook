# Continuous integration: formatting, build and tests, and a secret scan.
# Every third-party action is pinned to a full commit SHA. Dependabot proposes updates.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Read-only token for every job. No job needs to write.
permissions:
  contents: read

# A new push to a pull request cancels the run it replaces.
# Runs on develop and main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the Xcode version in README.md.
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  swift-format:
    name: swift-format
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_APP"
      - name: Lint
        run: scripts/format.sh

  # The build and tests run as parallel jobs, and `build-and-test` (the required check) passes
  # only when every one of them passed. Splitting them took the check from about 18 minutes to
  # the length of the slowest job. Nothing is cached between runs, so a pull request can't
  # leave build output behind for a later run on develop or main to pick up.
  # The Release check and the package tests share a runner: together they take about as long as
  # one UI part, and it keeps a run within the five macOS runners the free plan allows at once.
  release-and-package-tests:
    name: release-and-package-tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
      - name: Check the two Package.resolved files agree
        run: scripts/check-package-pins.sh
      - name: Build (Release)
        run: scripts/build.sh Release
      - name: Check the Release build has no debug or test code
        run: scripts/check-release.sh
      - name: Test (every package test target, anything that isn't a UI test)
        env:
          # Failed snapshots write the new image and a diff here (passed through to the simulator).
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/build/SnapshotArtifacts
        run: scripts/test.sh -skip-testing:NiftyOutfitNookUITests
      - name: Keep test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-package
          path: |
            build/TestResults.xcresult
            build/SnapshotArtifacts
          retention-days: 7
          if-no-files-found: ignore

  # The UI tests in four parts of about the same length, by test class. Each part has a fixed
  # cost of about 6 minutes on the hosted runner (setup, build, a cold simulator boot and the
  # first launch), so a part should hold several minutes of tests, and four parts plus the job
  # above stay within the five macOS runners the free plan allows at once.
  # Balanced in October 2026 from the classes' times on CI (in seconds, from the test log):
  #   ui-home-and-results       HomeTests 320, YourLooksTests 165, CutoutBenchTests 20
  #   ui-variants-and-style-me  HomeVariantTests 272, StyleMeTests 174, LaunchTests 75
  #   ui-add-and-catalog        AddPieceTests 367, CatalogTests about 175
  #   ui-rest                   the rest, about 580, and any new class
  # When a part grows well past the others, move a class. Each class's time is in the job log
  # ("Test Case ... passed (N seconds)").
  ui-tests:
    name: ui-tests (${{ matrix.part }})
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      # Let every part finish, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        include:
          - part: ui-home-and-results
            selection: >-
              -only-testing:NiftyOutfitNookUITests/HomeTests
              -only-testing:NiftyOutfitNookUITests/YourLooksTests
              -only-testing:NiftyOutfitNookUITests/CutoutBenchTests
          - part: ui-variants-and-style-me
            selection: >-
              -only-testing:NiftyOutfitNookUITests/HomeVariantTests
              -only-testing:NiftyOutfitNookUITests/StyleMeTests
              -only-testing:NiftyOutfitNookUITests/LaunchTests
          - part: ui-add-and-catalog
            selection: >-
              -only-testing:NiftyOutfitNookUITests/AddPieceTests
              -only-testing:NiftyOutfitNookUITests/CatalogTests
          # Every other UI test class, so a new one is never left out.
          - part: ui-rest
            selection: >-
              -only-testing:NiftyOutfitNookUITests
              -skip-testing:NiftyOutfitNookUITests/HomeTests
              -skip-testing:NiftyOutfitNookUITests/YourLooksTests
              -skip-testing:NiftyOutfitNookUITests/CutoutBenchTests
              -skip-testing:NiftyOutfitNookUITests/HomeVariantTests
              -skip-testing:NiftyOutfitNookUITests/StyleMeTests
              -skip-testing:NiftyOutfitNookUITests/LaunchTests
              -skip-testing:NiftyOutfitNookUITests/AddPieceTests
              -skip-testing:NiftyOutfitNookUITests/CatalogTests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list runtimes available
      - name: Test (${{ matrix.part }})
        env:
          # Failed snapshots write the new image and a diff here (passed through to the simulator).
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/build/SnapshotArtifacts
          SELECTION: ${{ matrix.selection }}
        # SELECTION is a fixed list of xcodebuild flags from the matrix above, split on spaces on purpose.
        #
        # A failed UI test runs once more, here only. This is for the hosted runner, not for our
        # tests: twice in about 25 runs (October 2026) a test was lost to the simulator failing to start the app
        # ("Timed out while launching application via Xcode", "Failed to get launch progress"),
        # which no wait in a test can catch. A test that fails twice still fails the job, and the
        # first failure stays in the test results. Package tests and local runs never retry.
        run: scripts/test.sh $SELECTION -retry-tests-on-failure -test-iterations 2
      - name: Keep test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-${{ matrix.part }}
          path: |
            build/TestResults.xcresult
            build/SnapshotArtifacts
          retention-days: 7
          if-no-files-found: ignore

  # The required check. It must run even when a job above fails or is cancelled (`always()`),
  # because GitHub counts a skipped required check as passed.
  build-and-test:
    name: build-and-test
    needs: [release-and-package-tests, ui-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every build and test job passed
        env:
          RELEASE_AND_PACKAGE: ${{ needs.release-and-package-tests.result }}
          UI_TESTS: ${{ needs.ui-tests.result }}
        run: |
          echo "release-and-package-tests: $RELEASE_AND_PACKAGE"
          echo "ui-tests: $UI_TESTS"
          [[ "$RELEASE_AND_PACKAGE" == "success" && "$UI_TESTS" == "success" ]]

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so every commit is scanned
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
