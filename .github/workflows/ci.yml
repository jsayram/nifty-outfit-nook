# Continuous integration: formatting, build and tests, and a secret scan.
# Every third-party action is pinned to a full commit SHA. Dependabot proposes updates.
name: CI

# What runs when (22 October 2026):
#   Pull request   swift-format, gitleaks, build-and-archive (the build, the archive check and every
#                  package test, iPhone snapshots included) and build-and-test. This is the fast gate.
#   run-ui label   The same, plus the UI tests (the iPhone parts), for a pull request that needs
#                  them before it merges.
#   Manual run     Everything, with the whole UI suite (the iPhone parts). This is the batch run on
#                  develop: scripts/run-ui-batch.sh starts it. Tick `include_ipad` to add iPad.
#   Push           The fast gate again on develop and main. No UI tests.
# The UI tests never start by themselves. iPad testing is paused until the app's features are done.
on:
  pull_request:
    # `labeled` and `unlabeled` so adding the run-ui label starts the UI tests.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [develop, main]
  # Run the whole UI suite by hand: Actions tab, CI, Run workflow (or scripts/run-ui-batch.sh).
  workflow_dispatch:
    inputs:
      include_ipad:
        description: >-
          Also run the iPad parts: the iPad UI tests (ui-ipad) and the iPad snapshot tests. iPad
          testing is paused until the app's features are done.
        type: boolean
        default: false
      cold_cache:
        description: >-
          Self-hosted runner only: empty its DerivedData cache first, to time a cold run.
        type: boolean
        default: false

# Read-only token for every job. No job needs to write.
permissions:
  contents: read

# A new push to a pull request cancels the run it replaces.
# Runs on develop and main always finish. The event name is in the group so that a push to develop
# can't replace a batch run waiting behind another run (a waiting run is dropped for a newer one
# in the same group).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the Xcode version in README.md. Every job runs on GitHub's `xcode-27`
  # image, the only hosted image with Xcode 27 (`macos-26` stops at 26.6). It installs 27.1 as
  # Xcode_27.1_Release_Candidate.app and links Xcode_27.1.app to it (runner-images,
  # images/macos/xcode-27-arm64-Readme.md, October 2026). Its default Xcode is 27.0, so each job
  # selects this one.
  XCODE_APP: /Applications/Xcode_27.1.app
  # The self-hosted runner (Jose's Mac) has Xcode 27.1 at /Applications/Xcode.app instead.
  # scripts/ci-select-xcode.sh uses XCODE_APP when it exists and falls back to that, so one value
  # works on both. Which runner the macOS jobs use is the repository variable MACOS_RUNNER (see
  # the README, "CI"): empty or unset means GitHub's `xcode-27`.
  # '1' except on a manual run. A few UI tests skip themselves when it is set, because package
  # tests cover what they check or another test walks the same screens (UITestTier in
  # NiftyOutfitNookUITests/UITestSupport.swift, and each test's comment, say why). A manual run
  # (workflow_dispatch) leaves it empty and runs every UI test.
  NOOK_PR_RUN: ${{ github.event_name != 'workflow_dispatch' && '1' || '' }}
  # '1' only on a manual run with cold_cache ticked (scripts/ci-local-cache.sh).
  NOOK_CI_COLD: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_cache && '1' || '' }}

jobs:
  swift-format:
    name: swift-format
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'xcode-27' || fromJSON(vars.MACOS_RUNNER || '"xcode-27"') }}
    timeout-minutes: 15
    steps:
      # A pull request from a fork never runs on the self-hosted runner: the runs-on line above
      # sends it to GitHub's hosted image, and this stops the job if that ever goes wrong.
      - name: Refuse a fork's pull request on the self-hosted runner
        if: ${{ runner.environment == 'self-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "A pull request from a fork must not run on the self-hosted runner." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci-select-xcode.sh
      - name: Lint
        run: scripts/format.sh

  # Which kind of change this is, from git (a pull request's base and head, or a push's before and
  # after). Two answers:
  #   code  Anything but docs (Markdown outside the source folders, docs/, website/). A docs-only
  #         change skips the build and test jobs below, and `build-and-test` still passes.
  #   ui    The pull request has the run-ui label (and isn't docs-only), or this is a manual
  #         run. Only then do the UI test jobs run. Every change that isn't docs-only still
  #         builds, makes the archive check and runs every package test (iPhone snapshot tests
  #         included). A pull request or push that touches a UI path without the label gets a
  #         note in the run's summary, and its UI tests run in the next batch on develop.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
      ui_paths: ${{ steps.filter.outputs.ui_paths }}
      ipad: ${{ steps.filter.outputs.ipad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: What changed?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # "true" or "false" as text. A run started by `gh workflow run -f include_ipad=false`
          # passes the text "false", which an expression would count as true, so it is compared
          # here as text.
          INCLUDE_IPAD: ${{ inputs.include_ipad }}
        run: |
          # Build and test everything unless a file list says less. The UI tests run on a manual
          # run (the batch), never on their own otherwise.
          code=true
          ui=false
          ui_paths=false
          if [[ "$EVENT" == "workflow_dispatch" ]]; then ui=true; fi
          files=""
          if [[ "$EVENT" == "pull_request" ]]; then
            files="$(git diff --name-only "$BASE...$HEAD")"
          elif [[ "$EVENT" == "push" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi
          if [[ -n "$files" ]]; then
            echo "$files"
            code=false
            while IFS= read -r file; do
              case "$file" in
                # UI paths: a change to one of these is UI-touching. It doesn't start the UI tests
                # (the run-ui label does, and the batch run on develop), but the summary says
                # so. Views and screens in Features (its model files are not UI), strings, the
                # design system, the app target (assets, entitlements, app file), its Info.plist,
                # the Xcode project, and the UI tests themselves.
                Packages/NookKit/Sources/Features/*Model.swift | Packages/NookKit/Sources/Features/*/*Model.swift | Packages/NookKit/Sources/Features/*/*/*Model.swift) code=true ;;
                Packages/NookKit/Sources/Features/* | Packages/NookKit/Sources/DesignSystem/*) code=true; ui_paths=true ;;
                NiftyOutfitNook/* | NiftyOutfitNookUITests/* | NiftyOutfitNook.xcodeproj/* | Configs/AppInfo.plist | *.xcstrings | *.xcassets/*) code=true; ui_paths=true ;;
                # Models, services, fixtures, backup, storage and the package tests build and test
                # without UI tests. A Markdown file in a source folder can end up in the app bundle.
                Packages/*) code=true ;;
                *.md | docs/* | website/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          if [[ ",$LABELS," == *",run-ui,"* && "$code" == "true" ]]; then ui=true; fi
          echo "Build and package tests: $code, UI tests: $ui, UI paths touched: $ui_paths"
          if [[ "$ui" == "false" && "$ui_paths" == "true" ]]; then
            echo "This change touches UI paths, so the UI tests are due. They did not run here: add the run-ui label to run them on this pull request, or they run in the next batch on develop (scripts/run-ui-batch.sh)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "ui_paths=$ui_paths" >> "$GITHUB_OUTPUT"
          # The paused iPad parts: only a manual run with include_ipad ticked.
          ipad=false
          if [[ "$EVENT" == "workflow_dispatch" && "$INCLUDE_IPAD" == "true" ]]; then ipad=true; fi
          echo "iPad parts: $ipad"
          echo "ipad=$ipad" >> "$GITHUB_OUTPUT"

  # The build and tests run as parallel jobs, and `build-and-test` (the required check) passes
  # only when every one of them passed.
  #
  # The free plan runs at most five macOS jobs at once, so there are at most five: this build job
  # and up to four test jobs (three on an iPhone, and the iPad one on a manual run that asks for
  # it). The test jobs start with this one, not after it, and boot their simulator
  # while it builds (booting takes 2 to 5 minutes on the hosted runner). When this job uploads
  # what it built, they download it and test it without building. Building during a boot on the
  # same runner was much slower (a build took 9 minutes instead of 1 to 2.5, October 2026).
  # If this job can't get a runner within 3 minutes (other runs hold them, or these test jobs
  # do), each test job builds for itself instead of waiting.
  #
  # The builds pass between jobs as artifacts of this run only: each test job asks for this
  # run's artifacts (scripts/wait-for-artifact.sh) and downloads them by name, with the digest
  # checked. Nothing is cached between runs, so a pull request can't leave build output behind
  # for a later run on develop or main to pick up.
  #
  # This job builds for testing (the UI test plan first, so the UI jobs can start sooner, then
  # the full plan with the package tests), makes an unsigned Release archive for a real iPhone
  # and checks it (scripts/check-archive.sh: Info.plist, privacy manifest, entitlements, no test
  # or debug code, and scripts/check-release.sh on the device binary), then runs a few UI test
  # classes and every package test target on an iPhone simulator. It runs the package tests
  # itself because it has their build: until October 2026 the iPad part ran them, which meant
  # uploading the full plan's products (144 MB) for that part to download, and the iPad part
  # started its own tests about 8 minutes in. The package tests run on an iPhone simulator. The
  # iPad snapshot tests draw iPad-sized windows on it (no iPad simulator is involved), and skip
  # themselves unless NOOK_IPAD_SNAPSHOTS is set (see the package test step).
  build-and-archive:
    name: build-and-archive
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'xcode-27' || fromJSON(vars.MACOS_RUNNER || '"xcode-27"') }}
    timeout-minutes: 40
    steps:
      # A pull request from a fork never runs on the self-hosted runner: the runs-on line above
      # sends it to GitHub's hosted image, and this stops the job if that ever goes wrong.
      - name: Refuse a fork's pull request on the self-hosted runner
        if: ${{ runner.environment == 'self-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "A pull request from a fork must not run on the self-hosted runner." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          scripts/ci-select-xcode.sh
          echo "Runner: $(sysctl -n hw.ncpu) cores, $(($(sysctl -n hw.memsize) / 1073741824)) GB memory"
      # Self-hosted only: keep DerivedData between jobs, and test on a simulator made for this job
      # (deleted in the last step). Other people use this Mac's simulators, so a job never uses
      # one of those.
      - name: Prepare the self-hosted runner (cache, own simulator)
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          scripts/ci-local-cache.sh
          echo "NOOK_SIM_ID=$(scripts/ci-simulator.sh create iPhone)" >> "$GITHUB_ENV"
      - name: Check the two Package.resolved files agree
        run: scripts/check-package-pins.sh
      - name: Build for testing (UI test plan)
        if: needs.changes.outputs.ui == 'true'
        env:
          NOOK_BUILD_ONLY: 1
          NOOK_TEST_PLAN: UITests
        run: |
          scripts/test.sh
          # The UI test jobs download this build, except on the self-hosted runner: the next job
          # builds from the cached DerivedData there, which is faster than an upload and a download.
          if [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]; then
            # tar keeps the apps' symlinks and permissions, which an artifact's zip doesn't.
            tar -czf "$RUNNER_TEMP/ui-test-products.tgz" -C build/DerivedData/Build/Products \
              Debug-iphonesimulator/NiftyOutfitNook.app Debug-iphonesimulator/NiftyOutfitNookUITests-Runner.app \
              $(cd build/DerivedData/Build/Products && ls -- *_UITests_*.xctestrun)
          fi
      - if: ${{ needs.changes.outputs.ui == 'true' && runner.environment == 'github-hosted' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-products
          path: ${{ runner.temp }}/ui-test-products.tgz
          retention-days: 1
          overwrite: true
      # Not uploaded: this job runs the package tests, so nothing else needs this build.
      - name: Build for testing (full plan, with the package tests)
        env:
          NOOK_BUILD_ONLY: 1
        run: scripts/test.sh
      # Before this job's own tests: with a simulator running, the archive took twice as long.
      - name: Archive (Release, unsigned) and check what would ship
        run: scripts/check-archive.sh
      - name: Test (ui-catalog-and-profile)
        if: needs.changes.outputs.ui == 'true'
        # The UI tests' retry is explained in the ui-tests job below.
        run: >-
          NOOK_XCTESTRUN="$(ls build/DerivedData/Build/Products/*_UITests_*.xctestrun)"
          scripts/test.sh
          -only-testing:NiftyOutfitNookUITests/CatalogTests
          -only-testing:NiftyOutfitNookUITests/ProfileTests
          -only-testing:NiftyOutfitNookUITests/CutoutBenchTests
          -retry-tests-on-failure -test-iterations 2
      - name: Test (every package test target)
        # Also after a UI test failure, so one doesn't hide the other.
        if: ${{ !cancelled() }}
        env:
          NOOK_RESULT_BUNDLE: build/TestResults-package.xcresult
          # '1' only on a manual run with include_ipad ticked. The iPad snapshot tests skip
          # themselves otherwise (IPadSnapshots in Packages/NookKit/Tests/NookTestSupport).
          NOOK_IPAD_SNAPSHOTS: ${{ needs.changes.outputs.ipad == 'true' && '1' || '' }}
          # Failed snapshots write the new image and a diff here (passed through to the simulator).
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/build/SnapshotArtifacts
        run: >-
          NOOK_XCTESTRUN="$(ls build/DerivedData/Build/Products/*_NiftyOutfitNook_*.xctestrun)"
          scripts/test.sh -skip-testing:NiftyOutfitNookUITests
      - name: Keep test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-build-and-archive
          path: |
            build/TestResults.xcresult
            build/TestResults-package.xcresult
            build/SnapshotArtifacts
          retention-days: 7
          if-no-files-found: ignore
      - name: Delete this job's simulator
        if: ${{ always() && runner.environment == 'self-hosted' && env.NOOK_SIM_ID != '' }}
        run: scripts/ci-simulator.sh delete "$NOOK_SIM_ID"

  # The other UI tests in three parts, by test class, on an iPhone simulator. The iPad layouts
  # are paused: they are the separate `ui-ipad` job below, which runs only on a manual run with
  # include_ipad ticked (iPad testing waits until the app's features are done).
  #
  # What runs when. These parts run only with the run-ui label on a pull request, or on a manual
  # run (the batch run on develop, scripts/run-ui-batch.sh); never by themselves (see `changes`).
  # They cover the real user flows once; a test that package tests already cover, or that repeats
  # another test's screens at the largest text size, skips itself (NOOK_PR_RUN above) and runs
  # only in a manual full-suite run. The sizes below are the normal run's, then the full suite's,
  # in seconds of tests (the classes' mean times from the test log, 6 runs on Xcode 27.1, 20 and
  # 21 October 2026). A class can take 1.5 to 2 times as long from one run to the next, and a
  # failed test that retries adds its own time again.
  # A test part spends 4 to 5 minutes outside its tests (waiting for the build, downloading it,
  # booting the simulator), and build-and-archive about 8 (two builds, the archive, then a cold
  # boot), so a run with UI tests is about 15 minutes.
  #   (build-and-archive)     CatalogTests 103, ProfileTests 58 / 137, CutoutBenchTests 0 / 53,
  #                           package tests about 200 to 250
  #   ui-audit-and-settings   AccessibilityAuditTests 418, SettingsTests 112 / 217,
  #                           HomeVariantTests 25 / 99, LaunchTests 12 / 77, and the large-text
  #                           audits of Closet and Profile (0 / 231)
  #   ui-add-and-saved        AddPieceTests 202, SavedLooksTests 150, HomeTourTests 120 / 138,
  #                           OnboardingTests 82, BackupsTests 55, ScreenToursTests 0 / 257,
  #                           and the large-text audits of Style Me, Saved Looks, Onboarding and
  #                           Home (0 / 269)
  #   ui-rest                 GarmentDetailTests 80, HomeTests 126, StyleMeTests 113,
  #                           SuitcasesAndLaundryTests 85 / 109, SwapTests 59, ClosetTests 52,
  #                           MakeYourOwnLookTests 51, YourLooksTests 38 / 117, and any new class
  #   ui-ipad (paused)        IPadTests 191, IPadKeyboardTests 95, IPadStyleMeAndSavedTests 90
  # When a part grows well past the others, move a class. A new iPad class goes in ui-ipad;
  # in ui-rest it would only skip itself on the iPhone. Every part, the iPad one too, tests what
  # the UI test plan's build made and downloads only that (28 MB).
  ui-tests:
    name: ui-tests (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'xcode-27' || fromJSON(vars.MACOS_RUNNER || '"xcode-27"') }}
    timeout-minutes: 40
    permissions:
      contents: read
      # To see this run's artifacts and jobs while waiting for the build.
      actions: read
    strategy:
      # Let every part finish, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        include:
          - part: ui-audit-and-settings
            family: iPhone
            selection: >-
              -only-testing:NiftyOutfitNookUITests/AccessibilityAuditTests
              -only-testing:NiftyOutfitNookUITests/SettingsTests
              -only-testing:NiftyOutfitNookUITests/HomeVariantTests
              -only-testing:NiftyOutfitNookUITests/LaunchTests
              -only-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testClosetAndItsScreens
              -only-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testProfileAndSettings
          - part: ui-add-and-saved
            family: iPhone
            selection: >-
              -only-testing:NiftyOutfitNookUITests/AddPieceTests
              -only-testing:NiftyOutfitNookUITests/SavedLooksTests
              -only-testing:NiftyOutfitNookUITests/HomeTourTests
              -only-testing:NiftyOutfitNookUITests/OnboardingTests
              -only-testing:NiftyOutfitNookUITests/BackupsTests
              -only-testing:NiftyOutfitNookUITests/ScreenToursTests
              -only-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testStyleMeAndYourLooks
              -only-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testSavedLooksAndPictures
              -only-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testOnboarding
              -only-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testHomeAndItsTour
          # Every other UI test, so a new class or test is never left out: this part names only
          # what the others run, and skips exactly that.
          - part: ui-rest
            family: iPhone
            selection: >-
              -only-testing:NiftyOutfitNookUITests
              -skip-testing:NiftyOutfitNookUITests/CatalogTests
              -skip-testing:NiftyOutfitNookUITests/ProfileTests
              -skip-testing:NiftyOutfitNookUITests/CutoutBenchTests
              -skip-testing:NiftyOutfitNookUITests/AccessibilityAuditTests
              -skip-testing:NiftyOutfitNookUITests/SettingsTests
              -skip-testing:NiftyOutfitNookUITests/HomeVariantTests
              -skip-testing:NiftyOutfitNookUITests/LaunchTests
              -skip-testing:NiftyOutfitNookUITests/AddPieceTests
              -skip-testing:NiftyOutfitNookUITests/SavedLooksTests
              -skip-testing:NiftyOutfitNookUITests/HomeTourTests
              -skip-testing:NiftyOutfitNookUITests/OnboardingTests
              -skip-testing:NiftyOutfitNookUITests/BackupsTests
              -skip-testing:NiftyOutfitNookUITests/ScreenToursTests
              -skip-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testClosetAndItsScreens
              -skip-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testProfileAndSettings
              -skip-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testStyleMeAndYourLooks
              -skip-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testSavedLooksAndPictures
              -skip-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testOnboarding
              -skip-testing:NiftyOutfitNookUITests/AccessibilityAuditLargeTextTests/testHomeAndItsTour
              -skip-testing:NiftyOutfitNookUITests/IPadTests
              -skip-testing:NiftyOutfitNookUITests/IPadStyleMeAndSavedTests
              -skip-testing:NiftyOutfitNookUITests/IPadKeyboardTests
    steps:
      # A pull request from a fork never runs on the self-hosted runner: the runs-on line above
      # sends it to GitHub's hosted image, and this stops the job if that ever goes wrong.
      - name: Refuse a fork's pull request on the self-hosted runner
        if: ${{ runner.environment == 'self-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "A pull request from a fork must not run on the self-hosted runner." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci-select-xcode.sh
      - name: Start booting the simulator
        env:
          NOOK_SIM_FAMILY: ${{ matrix.family }}
        run: |
          echo "Runner: $(sysctl -n hw.ncpu) cores, $(($(sysctl -n hw.memsize) / 1073741824)) GB memory"
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" ]]; then
            # The cached DerivedData, and a simulator made for this job (deleted in the last step).
            scripts/ci-local-cache.sh
            simulator="$(scripts/ci-simulator.sh create "$NOOK_SIM_FAMILY")"
          else
            simulator="$(scripts/simulator.sh)"
          fi
          echo "NOOK_SIM_ID=$simulator" >> "$GITHUB_ENV"
          # In the background: the next steps wait for the build meanwhile. xcodebuild waits
          # for the boot to finish, or boots the simulator itself if this failed.
          xcrun simctl boot "$simulator" > "$RUNNER_TEMP/boot.log" 2>&1 &
      - name: Wait for the build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        # Self-hosted: one runner runs one job at a time, so waiting here would hold the runner
        # build-and-archive needs (it would give up after 3 minutes and build here anyway).
        # Skip the wait and build here, from the cached DerivedData: a no-op when it is current.
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" ]]; then
            echo "Self-hosted runner: building here from the cached DerivedData, not waiting."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            scripts/wait-for-artifact.sh ui-test-products build-and-archive
          fi
      - if: steps.build.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-test-products
          path: ${{ runner.temp }}
      - name: Unpack the build, or build here if build-and-archive couldn't start
        env:
          READY: ${{ steps.build.outputs.ready }}
        run: |
          if [[ "$READY" == "true" ]]; then
            mkdir -p build/Products
            tar -xzf "$RUNNER_TEMP/ui-test-products.tgz" -C build/Products
            echo "PRODUCTS_DIR=build/Products" >> "$GITHUB_ENV"
          else
            NOOK_BUILD_ONLY=1 NOOK_TEST_PLAN=UITests scripts/test.sh
            # build-for-testing writes an .xctestrun for each of the scheme's test plans, and the
            # test step expects exactly one. Keep the UI plan's.
            rm -f build/DerivedData/Build/Products/NiftyOutfitNook_NiftyOutfitNook_*.xctestrun
            echo "PRODUCTS_DIR=build/DerivedData/Build/Products" >> "$GITHUB_ENV"
          fi
      - name: Test (${{ matrix.part }})
        env:
          SELECTION: ${{ matrix.selection }}
          # Empty unless a part sets `workers`: how many cloned simulators test at once.
          NOOK_PARALLEL_WORKERS: ${{ matrix.workers }}
        # SELECTION is a fixed list of xcodebuild flags from the matrix above, split on spaces on purpose.
        #
        # A failed UI test runs once more, here only. This is for the hosted runner, not for our
        # tests: twice in about 25 runs (October 2026) a test was lost to the simulator failing to start the app
        # ("Timed out while launching application via Xcode", "Failed to get launch progress"),
        # which no wait in a test can catch. A test that fails twice still fails the job, and the
        # first failure stays in the test results. Package tests and local runs never retry.
        run: >-
          NOOK_XCTESTRUN="$(ls "$PRODUCTS_DIR"/*.xctestrun)"
          scripts/test.sh $SELECTION -retry-tests-on-failure -test-iterations 2
      - name: Keep test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-${{ matrix.part }}
          path: build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
      - name: Delete this job's simulator
        if: ${{ always() && runner.environment == 'self-hosted' && env.NOOK_SIM_ID != '' }}
        run: scripts/ci-simulator.sh delete "$NOOK_SIM_ID"

  # The iPad UI tests (Phases 15a and 15b), on the iPad Pro 11-inch (M5) simulator. PAUSED: this
  # job runs only on a manual run with include_ipad ticked (`changes` works that out). It is the
  # `ui-tests` job above with one iPad part, kept as its own job so that a run without the box
  # ticked doesn't start it at all. Every one of these tests skips itself on an iPhone. Keep its
  # steps in line with `ui-tests`. To turn iPad back on, see "Turning iPad testing back on" in
  # README.md.
  ui-ipad:
    name: ui-tests (ui-ipad)
    needs: changes
    if: needs.changes.outputs.ipad == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'xcode-27' || fromJSON(vars.MACOS_RUNNER || '"xcode-27"') }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      # A pull request from a fork never runs on the self-hosted runner: the runs-on line above
      # sends it to GitHub's hosted image, and this stops the job if that ever goes wrong.
      - name: Refuse a fork's pull request on the self-hosted runner
        if: ${{ runner.environment == 'self-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "A pull request from a fork must not run on the self-hosted runner." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci-select-xcode.sh
      - name: Start booting the simulator
        env:
          NOOK_SIM_FAMILY: iPad
        run: |
          echo "Runner: $(sysctl -n hw.ncpu) cores, $(($(sysctl -n hw.memsize) / 1073741824)) GB memory"
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" ]]; then
            # The cached DerivedData, and a simulator made for this job (deleted in the last step).
            scripts/ci-local-cache.sh
            simulator="$(scripts/ci-simulator.sh create "$NOOK_SIM_FAMILY")"
          else
            simulator="$(scripts/simulator.sh)"
          fi
          echo "NOOK_SIM_ID=$simulator" >> "$GITHUB_ENV"
          # In the background: the next steps wait for the build meanwhile. xcodebuild waits
          # for the boot to finish, or boots the simulator itself if this failed.
          xcrun simctl boot "$simulator" > "$RUNNER_TEMP/boot.log" 2>&1 &
      - name: Wait for the build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        # Self-hosted: one runner runs one job at a time, so waiting here would hold the runner
        # build-and-archive needs (it would give up after 3 minutes and build here anyway).
        # Skip the wait and build here, from the cached DerivedData: a no-op when it is current.
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" ]]; then
            echo "Self-hosted runner: building here from the cached DerivedData, not waiting."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            scripts/wait-for-artifact.sh ui-test-products build-and-archive
          fi
      - if: steps.build.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-test-products
          path: ${{ runner.temp }}
      - name: Unpack the build, or build here if build-and-archive couldn't start
        env:
          READY: ${{ steps.build.outputs.ready }}
        run: |
          if [[ "$READY" == "true" ]]; then
            mkdir -p build/Products
            tar -xzf "$RUNNER_TEMP/ui-test-products.tgz" -C build/Products
            echo "PRODUCTS_DIR=build/Products" >> "$GITHUB_ENV"
          else
            NOOK_BUILD_ONLY=1 NOOK_TEST_PLAN=UITests scripts/test.sh
            # build-for-testing writes an .xctestrun for each of the scheme's test plans, and the
            # test step expects exactly one. Keep the UI plan's.
            rm -f build/DerivedData/Build/Products/NiftyOutfitNook_NiftyOutfitNook_*.xctestrun
            echo "PRODUCTS_DIR=build/DerivedData/Build/Products" >> "$GITHUB_ENV"
          fi
      - name: Test (ui-ipad)
        env:
          SELECTION: >-
            -only-testing:NiftyOutfitNookUITests/IPadTests
            -only-testing:NiftyOutfitNookUITests/IPadStyleMeAndSavedTests
            -only-testing:NiftyOutfitNookUITests/IPadKeyboardTests
        # SELECTION is a fixed list of xcodebuild flags, split on spaces on purpose.
        #
        # A failed UI test runs once more, here only. This is for the hosted runner, not for our
        # tests: twice in about 25 runs (October 2026) a test was lost to the simulator failing to start the app
        # ("Timed out while launching application via Xcode", "Failed to get launch progress"),
        # which no wait in a test can catch. A test that fails twice still fails the job, and the
        # first failure stays in the test results. Package tests and local runs never retry.
        run: >-
          NOOK_XCTESTRUN="$(ls "$PRODUCTS_DIR"/*.xctestrun)"
          scripts/test.sh $SELECTION -retry-tests-on-failure -test-iterations 2
      - name: Keep test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-ui-ipad
          path: build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
      - name: Delete this job's simulator
        if: ${{ always() && runner.environment == 'self-hosted' && env.NOOK_SIM_ID != '' }}
        run: scripts/ci-simulator.sh delete "$NOOK_SIM_ID"

  # The required check. It must run even when a job above fails or is cancelled (`always()`),
  # because GitHub counts a skipped required check as passed. When `changes` found a docs-only
  # pull request, the build and test jobs are skipped on purpose and this passes.
  build-and-test:
    name: build-and-test
    needs: [changes, build-and-archive, ui-tests, ui-ipad]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every build and test job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          UI: ${{ needs.changes.outputs.ui }}
          BUILD_AND_ARCHIVE: ${{ needs.build-and-archive.result }}
          UI_TESTS: ${{ needs.ui-tests.result }}
          IPAD: ${{ needs.changes.outputs.ipad }}
          UI_IPAD: ${{ needs.ui-ipad.result }}
        run: |
          echo "changes: $CHANGES (build and test: $CODE)"
          echo "build-and-archive: $BUILD_AND_ARCHIVE"
          echo "ui-tests: $UI_TESTS"
          echo "ui-ipad: $UI_IPAD (iPad parts: $IPAD)"
          [[ "$CHANGES" == "success" ]] || exit 1
          if [[ "$CODE" == "false" ]]; then
            echo "Docs only: nothing to build or test."
            exit 0
          fi
          [[ "$BUILD_AND_ARCHIVE" == "success" ]] || exit 1
          # The paused iPad job: skipped on purpose, unless this run asked for it.
          if [[ "$IPAD" == "true" ]]; then
            [[ "$UI_IPAD" == "success" ]] || exit 1
          else
            [[ "$UI_IPAD" == "skipped" ]] || exit 1
          fi
          if [[ "$UI" == "false" ]]; then
            echo "The UI tests were skipped on purpose (no run-ui label, not a manual run)."
            [[ "$UI_TESTS" == "skipped" ]]
          else
            [[ "$UI_TESTS" == "success" ]]
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so every commit is scanned
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
